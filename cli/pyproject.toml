[project]
name = "ttodo"
version = "0.1.0"
description = "A friendly command-line client for the Team Todo API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "attrs>=26.1.0",
    "httpx>=0.28.1",
    "typer>=0.27.3",
]

[project.scripts]
ttodo = "ttodo.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "openapi-python-client>=0.29.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["src/ttodo/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_return_any = true
disallow_any_generics = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
mypy_path = "src"
follow_imports = "skip"
